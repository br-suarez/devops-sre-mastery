# directivas top-level (pid, logs)
pid /home/abrmnto/Documentos/nginx-lab.pid;
error_log /tmp/nginx-lab-error.log;

events { }

http {
    log_format edge '$remote_addr "$request" $status '
	    'request_time=$request_time '
	    'upstream_time=$upstream_response_time';
    access_log /tmp/nginx-lab-access.log edge;

    # Timeouts para todas las locations
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    # Upstream	    
    upstream  backend {       # requerido #6
    	server localhost:8080;
	keepalive 16;
    }
    
	#HTTP -> HTTPS
	server {
    	listen 8081;             # requerido #1
	server_name pulse.local;
	return 301 https:8443$request_uri;
	}    
    
	# HTTPS con terminación TLS
    server {
    	listen 8443 ssl; http2 on;
    	server_name pulse.local;

    	# Rutas del certificado (rutas relativas al directorio desde donde lanzas nginx)
    	ssl_certificate     tls/server.crt;
    	ssl_certificate_key tls/server.key;

    	# Opcional pero recomendado: sesión resumida para medir coste después
    	ssl_session_cache   shared:SSL:1m;
    	ssl_session_timeout 10m;

		# Restringir a TLS 1.2 y 1.3
		ssl_protocols	TLSv1.2 TLSv1.3;
		ssl_prefer_server_ciphers on;

    	# Pasar el esquema original al backend (¡clave!)
    	location / {
        	proxy_pass http://localhost:3000;
        	proxy_set_header X-Real-IP 		$remote_addr;
        	proxy_set_header X-Forwarded-For 	$proxy_add_x_forwarded_for;
        	proxy_set_header X-Forwarded-Proto 	$scheme;
        	proxy_set_header Host 			$host;
    	}	

    	location /api/ {
        	proxy_pass http://backend;
        	proxy_set_header X-Real-IP 		$remote_addr;
        	proxy_set_header X-Forwarded-For 	$proxy_add_x_forwarded_for;
        	proxy_set_header X-Forwarded-Proto 	$scheme;
        	proxy_set_header Host 			$host;
        	proxy_http_version 1.1;
        	proxy_set_header Connection "";
    	}
	location /debug {
    		return 200 'scheme=$scheme host=$host\n';
	}
     }   
    }
